name: gearboy # you probably want to 'snapcraft register <name>'
version: '3.8.20' # just for humans, typically '1.2+git' or '1.3.2'
summary:  A cross-platform Game Boy & Game Boy Color emulator. # 79 char long summary
description: |
  Gearboy is a cross-platform Game Boy / Game Boy Color emulator
  written in C++ that runs on Windows, macOS, Linux, BSD, iOS,
  Raspberry Pi and RetroArch.

  _More build details: https://github.com/Joker2770/Gearboy-snap.git_

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
base: core26

plugs:
  desktop:
    mount-host-font-cache: false

layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

apps:
  gearboy:
    command: usr/local/bin/gearboy
    command-chain: ["snap/command-chain/alsa-launch"]
    environment:
      # pulseaudio
      LD_LIBRARY_PATH: "$LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/local/lib"
      SNAP_DESKTOP_RUNTIME: $SNAP/gnome-platform
      GTK_USE_PORTAL: '1'
    extensions: [gnome]
    plugs:
      - home
      - alsa
      - audio-playback
      - pulseaudio
      - desktop
      - desktop-legacy
      - gsettings
      - wayland
      - unity7
      - x11
      - opengl
      - removable-media
      - mount-observe
      - joystick

parts:
  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    stage-packages:
      - libasound2
      - libasound2-plugins
      - yad
  gearboy:
    after: [alsa-mixin]
    plugin: make
    source: https://github.com/drhelius/Gearboy.git
    source-type: git
    source-tag: "3.8.20"
    source-subdir: platforms/linux
    build-packages:
      - gcc
      - make
      - pkg-config
      - build-essential
      - libsdl3-dev
      - libgl-dev
    stage-packages:
      - libsdl3-0
    override-build: |
      cd ${CRAFT_PART_SRC}/platforms/linux
      make -j $(nproc)
      mkdir -p ${CRAFT_PART_INSTALL}/usr/local/bin
      cp ./gearboy ${CRAFT_PART_INSTALL}/usr/local/bin/

